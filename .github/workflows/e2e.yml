# Playwright E2E — ADVISORY (plan-04 C6 / OD-5).
#
# The gating web checks (svelte-check + vitest + vite build) run in the fks
# repo's CI per CLAUDE.md; this is a SEPARATE, non-blocking browser-test job so
# a flaky spec can never wedge a merge while we observe real-world flake.
#
# The suite is backend-free by design: cockpit + treasury specs route-mock their
# APIs, the seam specs exercise only the dev server's own honest-empty/403
# degrade paths (WEBUI_AUTH=disabled, DB URLs blanked in playwright.config.ts),
# and users-roles self-skips without a database. No secrets, no live stack.
#
# PROMOTED TO A REQUIRED CHECK 2026-08-05, per the criterion this header carried
# since the job shipped: one quiet week of green/low-flake runs. The record
# 2026-07-29 -> 08-05: every completed run success (16+ runs across the
# triage/Stage-3/Stage-4-5 traffic), zero failures, zero flakes on main.
# The suite itself went 12-red -> 0 on 07-30 and has held.
# Remaining half of the promotion: add this job to branch-protection required
# checks (repo settings / gh api) after this merges.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes cancel superseded in-flight runs on the same ref.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    # Advisory: a red run must NOT fail the workflow / block a merge (OD-5).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (with OS deps)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
