<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- PWA / installable app (M1): manifest + theme + iOS home-screen meta.
       iOS Safari ignores the manifest's display/icons for Add-to-Home-Screen,
       so the apple-* meta + apple-touch-icon below are required. No service
       worker is registered (offline caching is a deliberately-later milestone). -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0c0c14" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FKS" />
  <title>FKS Terminal</title>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
